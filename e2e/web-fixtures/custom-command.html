<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Custom Command Fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px;
      }

      main {
        display: grid;
        gap: 16px;
        max-width: 480px;
      }

      label {
        display: grid;
        gap: 8px;
      }

      input {
        padding: 10px 12px;
        font-size: 16px;
      }

      button {
        padding: 10px 12px;
        font-size: 16px;
      }

      #result {
        min-height: 24px;
      }

      #login-result {
        min-height: 24px;
      }

      x-maestro {
        display: none;
      }
    </style>
  </head>
  <body>
    <x-maestro name="search products">
      - tapOn: Search all products
      - inputText: $0
    </x-maestro>

    <x-maestro name="login user">
      - tapOn: Email
      - inputText: $email
      - tapOn: Password
      - inputText: $password
      - tapOn: Sign in
    </x-maestro>

    <main>
      <h1>Custom Command Fixture</h1>

      <section aria-label="Login form">
        <label for="email-input">
          Email
          <input
            id="email-input"
            aria-label="Email"
            placeholder="Email"
          />
        </label>

        <label for="password-input">
          Password
          <input
            id="password-input"
            aria-label="Password"
            placeholder="Password"
            type="password"
          />
        </label>

        <button id="sign-in-button" type="button">Sign in</button>

        <div id="login-result" aria-live="polite"></div>
      </section>

      <label for="search-input">
        Search all products
        <input
          id="search-input"
          aria-label="Search all products"
          placeholder="Search all products"
        />
      </label>

      <div id="result" aria-live="polite"></div>
    </main>

    <script>
      const emailInput = document.getElementById("email-input");
      const passwordInput = document.getElementById("password-input");
      const signInButton = document.getElementById("sign-in-button");
      const loginResult = document.getElementById("login-result");
      const input = document.getElementById("search-input");
      const result = document.getElementById("result");

      signInButton.addEventListener("click", () => {
        if (!emailInput.value || !passwordInput.value) {
          loginResult.textContent = "Missing credentials";
          return;
        }

        loginResult.textContent = `Signed in as ${emailInput.value}`;
      });

      input.addEventListener("input", () => {
        result.textContent = input.value;
      });
    </script>
  </body>
</html>
